<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Digital Task Force ISMS badge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ringNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153c2e"/>
      <stop offset="1" stop-color="#0a1712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d488"/>
      <stop offset="0.5" stop-color="#caa159"/>
      <stop offset="1" stop-color="#a9813c"/>
    </linearGradient>
    <linearGradient id="innerNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123026"/>
      <stop offset="1" stop-color="#0a1712"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#237a5d"/>
      <stop offset="1" stop-color="#0d271e"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc978"/>
      <stop offset="1" stop-color="#b7913f"/>
    </linearGradient>
  </defs>

  <!-- badge disc -->
  <circle cx="100" cy="100" r="97" fill="url(#gold)"/>
  <circle cx="100" cy="100" r="94" fill="url(#ringNavy)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="66" fill="url(#innerNavy)"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- curved text -->
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" fill="url(#gold)"
        font-size="18" letter-spacing="1.6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DIGITAL TASK FORCE</textPath>
  </text>
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" fill="url(#gold)"
        font-size="20" letter-spacing="6">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">ISMS</textPath>
  </text>
  <path id="topArc" d="M 26 100 A 74 74 0 0 1 174 100" fill="none"/>
  <path id="botArc" d="M 30 100 A 70 70 0 0 0 170 100" fill="none"/>

  <!-- side diamonds (separators, not stars) -->
  <g fill="url(#gold)">
    <rect x="15.5" y="96" width="7" height="7" transform="rotate(45 19 99.5)"/>
    <rect x="177.5" y="96" width="7" height="7" transform="rotate(45 181 99.5)"/>
  </g>

  <!-- center crest: shield + original hawk -->
  <g>
    <!-- shield -->
    <path d="M100 46 L134 57 V92 C134 116 120 132 100 142 C80 132 66 116 66 92 V57 Z"
          fill="url(#gold)"/>
    <path d="M100 50 L130 60 V92 C130 113 118 127 100 136 C82 127 70 113 70 92 V60 Z"
          fill="url(#shieldG)"/>

    <!-- hawk (symmetric: right half + mirrored) -->
    <g>
      <path d="M100 66 L108 74 L100 80 L92 74 Z" fill="#f4efe0"/>
      <path d="M96 76 L104 76 L100 84 Z" fill="url(#gold)"/>
      <path d="M94 82 L106 82 L103 104 L100 110 L97 104 Z" fill="#0d271e"/>
      <path d="M97 106 L103 106 L102 120 L100 124 L98 120 Z" fill="#0a1712"/>
      <!-- talons -->
      <path d="M96 110 L92 122 L95 121 L96 126 L98 118 Z" fill="url(#gold)"/>
      <path d="M104 110 L108 122 L105 121 L104 126 L102 118 Z" fill="url(#gold)"/>

      <!-- right wing (three feathers) -->
      <g>
        <path d="M104 82 L128 68 L124 80 L106 92 Z" fill="url(#wingBlue)"/>
        <path d="M105 90 L126 82 L121 93 L106 100 Z" fill="#cfa860"/>
        <path d="M105 98 L120 96 L114 107 L106 108 Z" fill="#a5823c"/>
      </g>
      <!-- left wing (mirror of right about x=100) -->
      <g transform="matrix(-1,0,0,1,200,0)">
        <path d="M104 82 L128 68 L124 80 L106 92 Z" fill="url(#wingBlue)"/>
        <path d="M105 90 L126 82 L121 93 L106 100 Z" fill="#cfa860"/>
        <path d="M105 98 L120 96 L114 107 L106 108 Z" fill="#a5823c"/>
      </g>
      <!-- eyes -->
      <circle cx="97" cy="74" r="1.3" fill="#0a1712"/>
      <circle cx="103" cy="74" r="1.3" fill="#0a1712"/>
    </g>
  </g>
</svg>
