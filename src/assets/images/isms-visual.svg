<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1c15"/>
      <stop offset="0.55" stop-color="#10241c"/>
      <stop offset="1" stop-color="#14130b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1c6b52" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#b08a46" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9e79"/>
      <stop offset="1" stop-color="#146b52"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c179"/>
      <stop offset="1" stop-color="#b08a46"/>
    </linearGradient>
  </defs>

  <rect width="520" height="560" rx="18" fill="url(#bg)"/>
  <rect width="520" height="560" rx="18" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#b08a46" stroke-opacity="0.09" stroke-width="1">
    <path d="M0 90 H520 M0 190 H520 M0 290 H520 M0 390 H520 M0 490 H520"/>
    <path d="M90 0 V560 M190 0 V560 M290 0 V560 M390 0 V560 M470 0 V560"/>
  </g>

  <!-- concentric rings -->
  <g fill="none" stroke="#2f9e79" stroke-opacity="0.28">
    <circle cx="260" cy="250" r="150" stroke-dasharray="3 7"/>
    <circle cx="260" cy="250" r="115"/>
    <circle cx="260" cy="250" r="185" stroke-opacity="0.16"/>
  </g>

  <!-- data nodes on rings -->
  <g fill="#caa159">
    <circle cx="260" cy="100" r="4"/>
    <circle cx="410" cy="250" r="4"/>
    <circle cx="145" cy="335" r="4"/>
    <circle cx="370" cy="360" r="3"/>
    <circle cx="175" cy="150" r="3"/>
  </g>

  <!-- central shield with lock -->
  <path d="M260 150 L338 182 V262 C338 322 304 356 260 372 C216 356 182 322 182 262 V182 Z"
        fill="url(#shieldg)" opacity="0.96"/>
  <path d="M260 168 L322 194 V260 C322 308 296 336 260 350 C224 336 198 308 198 260 V194 Z"
        fill="#0c1c15"/>
  <!-- lock -->
  <rect x="238" y="258" width="44" height="38" rx="6" fill="url(#goldg)"/>
  <path d="M247 258 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#2f9e79" stroke-width="5"/>
  <circle cx="260" cy="274" r="5" fill="#0c1c15"/>
  <rect x="257.5" y="274" width="5" height="12" rx="2.5" fill="#0c1c15"/>

  <!-- floating chips -->
  <g opacity="0.92">
    <rect x="60" y="430" width="120" height="52" rx="10" fill="#123026" stroke="#2f9e79" stroke-opacity="0.45"/>
    <text x="120" y="455" text-anchor="middle" fill="#7fd0af" font-family="Poppins, sans-serif" font-size="13" font-weight="600">DPDP</text>
    <text x="120" y="472" text-anchor="middle" fill="#8a9d86" font-family="Poppins, sans-serif" font-size="10">Act 2023</text>
  </g>
  <g opacity="0.92">
    <rect x="340" y="440" width="130" height="52" rx="10" fill="#123026" stroke="#caa159" stroke-opacity="0.45"/>
    <text x="405" y="465" text-anchor="middle" fill="#e2c179" font-family="Poppins, sans-serif" font-size="13" font-weight="600">ISO 27001</text>
    <text x="405" y="482" text-anchor="middle" fill="#b0a079" font-family="Poppins, sans-serif" font-size="10">ISMS</text>
  </g>
</svg>
